[env:waveshare_s3]
; Waveshare ESP32-S3-AUDIO-Board (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM).
; ESP32-audioI2S currently requires Arduino core 3.x (pioarduino fork).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11 -std=gnu++17
build_flags =
  -std=gnu++20
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2
  -DWAVESHARE_VOICE_ESP_SR=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
  adafruit/Adafruit NeoPixel @ 1.12.5
; The Windows installer installs the audioI2S and ES8311 codec sources into ./lib.
; Their original upstream copyright/license files are retained there.
